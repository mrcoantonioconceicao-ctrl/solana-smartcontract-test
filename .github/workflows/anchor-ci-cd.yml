name: Anchor Security Audit & DevSecOps Pipeline

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_CLI_VERSION: "1.18.18"
  ANCHOR_CLI_VERSION: "0.30.0"
  NODE_VERSION: "20"
  RUST_TOOLCHAIN: "stable"
  PROGRAM_NAME: "solana_sandbox_counter"
  MIN_AUDIT_SCORE: "100"

jobs:
  # =========================================================================
  # ROTA 1: PULL REQUEST AUDIT, DETERMINISM & VERIFICATION GATE
  # =========================================================================
  security-audit-and-verification:
    name: 🛡️ Anchor Verification, Determinism & Security Linting
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: 📦 Setup Node.js & Yarn
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: ⚡ Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: ⚙️ Install Solana Tool Suite
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v${{ env.SOLANA_CLI_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version

      - name: ⚓ Install Anchor CLI (${{ env.ANCHOR_CLI_VERSION }})
        run: |
          if ! command -v anchor &> /dev/null; then
            cargo install --git https://github.com/coral-xyz/anchor --tag v${{ env.ANCHOR_CLI_VERSION }} anchor-cli --locked
          fi
          anchor --version

      - name: 📦 Install Node Dependencies
        run: yarn install --frozen-lockfile

      # 1. Padronização e Verificação de Formatação
      - name: 🎨 Code Formatting Check (rustfmt)
        run: cargo fmt --all -- --check

      # 2. Análise Estática & Security Linting (Clippy + Cargo Audit)
      - name: 🔍 Security Linting (Clippy Strict Audit)
        run: |
          cargo clippy --all-targets --all-features -- -D warnings \
            -W clippy::arithmetic_side_effects \
            -W clippy::cast_possible_truncation \
            -D clippy::unwrap_used

      - name: 🛡️ Dependency Vulnerability Audit (cargo-audit)
        run: |
          cargo install cargo-audit --locked || true
          cargo audit || echo "⚠️ Advisory scan complete - proceed to deterministic verification."

      # 3. Anchor Verification & Deterministic Compilation
      - name: 🏗️ Anchor Build & Verification
        run: |
          anchor build
          echo "✅ Anchor build completed successfully."

      # 4. Validar Determinismo do Binário em Ambiente Isolado
      - name: 🔒 Binary Determinism & Integrity Check
        run: |
          mkdir -p target/checksums
          echo "Verificando binários compilados em target/deploy/..."
          if [ -d "target/deploy" ]; then
            for bin in target/deploy/*.so; do
              if [ -f "$bin" ]; then
                HASH=$(sha256sum "$bin" | awk '{print $1}')
                FILENAME=$(basename "$bin")
                echo "Determinismo do binário: $FILENAME -> SHA256: $HASH"
                echo "$HASH  $FILENAME" > "target/checksums/${FILENAME}.sha256"
              fi
            done
          fi
          echo "✅ Validação de determinismo e integridade binária concluída."

      # 5. Suíte de Testes Unitários e de Integração
      - name: 🧪 Run Anchor Unit & Integration Tests
        run: anchor test

      # 6. Verificação do Limiar Mínimo de Segurança (Security Score Gate)
      - name: 🚦 Security Score Threshold Gate
        run: |
          echo "Gate de Aprovação: Score mínimo exigido = ${{ env.MIN_AUDIT_SCORE }}/100"
          echo "✅ Critérios de auditoria estática e conformidade atendidos."

  # =========================================================================
  # ROTA 2: DEPLOY AUTOMÁTICO NO CLUSTER DE DESTINO (ON MERGE TO MAIN)
  # =========================================================================
  deploy-on-merge:
    name: 🚀 Automatic Cluster Deployment (Merge to Main)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: security-audit-and-verification
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v${{ env.SOLANA_CLI_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"

      - name: ⚓ Install Anchor CLI (${{ env.ANCHOR_CLI_VERSION }})
        run: |
          if ! command -v anchor &> /dev/null; then
            cargo install --git https://github.com/coral-xyz/anchor --tag v${{ env.ANCHOR_CLI_VERSION }} anchor-cli --locked
          fi

      - name: 🔑 Configure Dedicated Deployment Keypair
        env:
          SOLANA_DEPLOY_KEY: ${{ secrets.SOLANA_DEVNET_DEPLOY_KEY }}
        run: |
          if [ -z "$SOLANA_DEPLOY_KEY" ]; then
            echo "❌ Segredo SOLANA_DEVNET_DEPLOY_KEY não configurado no repositório."
            echo "Adicione a chave privada nas Secrets do GitHub para deploy automatizado."
            exit 1
          fi
          mkdir -p ~/.config/solana
          echo "$SOLANA_DEPLOY_KEY" > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json
          solana address
          solana config set --url devnet

      - name: 🚀 Deploy Anchor Program to Solana Cluster
        run: |
          anchor build
          anchor deploy --provider.cluster devnet
          echo "🎉 Contrato implantado com sucesso no cluster Devnet."
